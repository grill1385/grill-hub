name: Lembretes de eventos e contas

on:
  schedule:
    - cron: "0 8 * * *"   # todos os dias às 08:00 UTC
  workflow_dispatch:

jobs:
  lembretes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lembretes de eventos (3 dias antes)
        run: node scripts/send-reminders.mjs
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      - name: Lembretes de contas por saldar
        run: node scripts/send-debt-reminders.mjs
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
