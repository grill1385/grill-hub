name: Lembretes de eventos

on:
  schedule:
    - cron: "0 8 * * *"   # todos os dias às 08:00 UTC (09:00 Lisboa no inverno)
  workflow_dispatch:

jobs:
  lembretes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/send-reminders.mjs
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
